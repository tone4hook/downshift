[package]
name = "switchyard-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
switchyard-libsy = { git = "https://github.com/tone4hook/Switchyard.git", rev = "2dd67d76ad12961f92359153e03686773e3e8761" }
switchyard-protocol = { git = "https://github.com/tone4hook/Switchyard.git", rev = "2dd67d76ad12961f92359153e03686773e3e8761" }
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
assert_matches = "1.5.0"

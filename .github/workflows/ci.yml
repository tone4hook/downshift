name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned images
        run: ./route-agent build
      - name: Verify engineering and the combined corpus
        run: ./route-agent eval verify --level full
      - name: Publish sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-verification
          retention-days: 30
          path: |
            results/verify-*/verification.json
            results/verify-*/verification.md
            results/verify-*/*.log
